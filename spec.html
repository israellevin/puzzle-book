<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="favicon.svg">
        <title>Behavior Specifications</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <style>
            :root {
                color: #1f2937;
                background-color: #fdf2f2;
                font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, 'Helvetica Neue', Arial, sans-serif;
                line-height: 1.5;
            }
            body {
                max-width: 46rem;
                margin: 0 auto;
                padding: 2rem 1.5rem 4rem;
            }
            h1,
            h2,
            h3 {
                color: #9f1239;
                line-height: 1.25;
            }
            code {
                padding: 0.1rem 0.3rem;
                border-radius: 0.25rem;
                background-color: #dddddd;
                font-size: 1.5em;
            }
        </style>
    </head>
    <body>
        <article id="spec">Loading the spec...</article>
        <script>
            fetch('spec.md')
                .then((response) => response.text())
                .then((text) => {
                    document.getElementById('spec').innerHTML = marked.parse(text);
                })
                .catch((error) => {
                    document.getElementById('spec').textContent = `Could not load spec.md: ${error.message}`;
                });
        </script>
    </body>
</html>
